name: Update vllm-ascend documentation issues

on:
  schedule:
    # 每周一 01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImportExcel module
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ImportExcel -Scope CurrentUser -Force

      - name: Update issue table
        shell: pwsh
        run: ./vllm-ascend-docs-issues.ps1

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vllm-ascend-docs-issues.csv vllm-ascend-docs-issues.xlsx vllm-ascend-docs-issues.md
          if git diff --staged --quiet; then
            echo "表格无变化，跳过提交"
            exit 0
          fi
          git commit -s -m "chore: update vllm-ascend documentation issue table"
          git push
